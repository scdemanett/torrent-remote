[package]
name = "torrent-remote"
version = "2.2.1"
description = "Remote control GUI for Transmission torrent daemon"
authors = ["qu1ck", "Steven Demanett"]
license = "GNU-AGPL-3.0"
repository = "https://github.com/scdemanett/torrent-remote/"
default-run = "torrent-remote"
edition = "2021"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }


[dependencies]
serde_json = "^1.0"
base64 = "^0.23"
lava_torrent = { git = "https://github.com/openscopeproject/lava_torrent", branch = "patches" }
# lava_torrent = { path = "../../lava_torrent" }
tokio = { version = "^1.53", features = ["fs", "macros", "sync", "time"] }
serde = { version = "^1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [ "devtools", "tray-icon"] }
rodio = { version = "^0.23", features = ["playback", "mp3"], default-features = false }
maxminddb = "^0.32"
font-loader = "0.11.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
dirs = "7.0.0"
# native-tls so the OS certificate store is used, like the background poller's reqwest client
tauri-plugin-http = { version = "2", default-features = false, features = ["charset", "cookies", "http2", "macos-system-configuration", "native-tls", "gzip", "deflate", "socks", "dangerous-settings"] }

[dependencies.reqwest]
version = "*"
features = ["native-tls", "socks", "gzip", "deflate"]

[target.'cfg(windows)'.dependencies]
winreg = "^0.56.0"
# same versions wry uses, for filtering the WebView2 context menu and for
# toasts that carry the app logo and open the app on a click (notification.rs)
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
